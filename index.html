<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>住院醫師里程碑 2.0 線上評核系統</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f0f4f8; margin: 0; padding: 15px; color: #2d3748; }
    .container { max-width: 950px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h1 { color: #1a365d; text-align: center; font-size: 22px; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; padding-bottom: 12px; }
    
    /* 基本資料列 (改為住院醫師、PGY、主治醫師三個下拉欄位) */
    .form-row { display: flex; gap: 15px; margin-bottom: 20px; background: #ebf8ff; padding: 15px; border-radius: 8px; border: 1px solid #bee3f8; flex-wrap: wrap; }
    .form-col { flex: 1; min-width: 220px; }
    label.field-label { font-weight: bold; display: block; margin-bottom: 6px; font-size: 14px; color: #2b6cb0; }
    input[type="text"], select, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; font-size: 14px; background-color: #fff; }
    
    /* 分頁標籤導覽 (Tabs) - 支援行動裝置橫向滑動 */
    .nav-tabs { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 6px; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; -webkit-overflow-scrolling: touch; }
    .tab-btn { padding: 9px 14px; border: none; background: #e2e8f0; color: #4a5568; font-weight: bold; font-size: 13.5px; border-radius: 6px; cursor: pointer; transition: 0.2s; white-space: nowrap; flex-shrink: 0; }
    .tab-btn.active { background: #3182ce; color: white; }
    .tab-btn:hover:not(.active) { background: #cbd5e0; }

    /* Section 區塊控制 */
    .section-content { display: none; }
    .section-content.active { display: block; }
    .category-title { background: #2b6cb0; color: white; padding: 10px 15px; font-size: 17px; font-weight: bold; border-radius: 6px; margin-bottom: 15px; }

    /* 評核卡片樣式與未作答告警顏色 */
    .eval-card { border: 1px solid #e2e8f0; border-radius: 8px; padding: 18px; margin-bottom: 25px; background: #ffffff; transition: all 0.3s ease; }
    .eval-card.unanswered { border: 2px solid #e53e3e !important; background-color: #fff5f5 !important; }
    .eval-title { font-weight: bold; font-size: 16.5px; color: #2c5282; margin-bottom: 12px; border-left: 4px solid #3182ce; padding-left: 8px; }
    
    /* Word 格式 5 欄表格 (響應式滑動外框) */
    .table-responsive { width: 100%; overflow-x: auto; margin-bottom: 15px; -webkit-overflow-scrolling: touch; }
    .level-table { width: 100%; border-collapse: collapse; min-width: 650px; table-layout: fixed; }
    .level-table th { background-color: #edf2f7; color: #2b6cb0; border: 1px solid #cbd5e0; padding: 8px; font-size: 14px; text-align: center; width: 20%; }
    .level-table td { border: 1px solid #cbd5e0; padding: 10px; font-size: 13px; color: #4a5568; line-height: 1.5; vertical-align: top; background-color: #fafafc; }

    /* 9顆星星位置定位軌道 */
    .star-track-container { position: relative; width: 100%; height: 65px; margin-top: 15px; margin-bottom: 12px; background: #f7fafc; border: 1px dashed #cbd5e0; border-radius: 8px; min-width: 650px; }
    .star-item { position: absolute; top: 8px; transform: translateX(-50%); text-align: center; cursor: pointer; user-select: none; }
    .star-icon { font-size: 26px; color: #cbd5e0; transition: color 0.2s, transform 0.2s; }
    .star-item:hover .star-icon, .star-item.active .star-icon { color: #f59e0b; transform: scale(1.15); }
    .star-label { font-size: 11px; font-weight: bold; color: #718096; margin-top: 2px; }
    .star-item.active .star-label { color: #d69e2e; }

    .star-item input[type="radio"] { display: none; }

    /* 特殊選項列 */
    .other-options-row { display: flex; gap: 20px; margin-top: 10px; padding: 10px 14px; background: #ffffff; border: 1px solid #fed7d7; border-radius: 6px; }
    .other-options-row label { font-size: 13.5px; font-weight: bold; color: #c53030; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .other-options-row input[type="radio"] { transform: scale(1.15); cursor: pointer; }

    /* 個別建議欄位與語音按鈕容器 */
    .item-suggestion { margin-top: 15px; background: #f8fafc; padding: 10px; border-radius: 6px; border: 1px solid #e2e8f0; }
    .suggestion-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .suggestion-header label { font-size: 13px; font-weight: bold; color: #4a5568; }
    
    /* 語音按鈕樣式 */
    .voice-btn { background: #edf2f7; border: 1px solid #cbd5e0; color: #2d3748; padding: 4px 10px; border-radius: 15px; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 4px; }
    .voice-btn:hover { background: #e2e8f0; }
    .voice-btn.recording { background: #fed7d7; border-color: #e53e3e; color: #9b2c2c; }

    /* 大項總結區塊 */
    .category-summary-box { background: #fffaf0; border: 1px solid #feebc8; border-radius: 8px; padding: 15px; margin-top: 25px; margin-bottom: 15px; transition: all 0.3s ease; }
    .category-summary-box.unanswered { border: 2px solid #e53e3e !important; background-color: #fff5f5 !important; }
    .summary-title { font-weight: bold; color: #9c4221; font-size: 15px; margin-bottom: 8px; }
    .summary-desc { font-size: 13px; color: #744210; margin-bottom: 10px; line-height: 1.5; }
    .summary-options { display: flex; gap: 15px; margin-bottom: 10px; }
    .summary-options label { font-size: 14px; font-weight: bold; color: #2d3748; cursor: pointer; }

    /* 按鈕列 */
    .btn-row { display: flex; justify-content: space-between; margin-top: 25px; gap: 15px; }
    .action-btn { flex: 1; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; }
    .prev-btn { background: #e2e8f0; color: #4a5568; }
    .next-btn { background: #3182ce; color: white; }
    .submit-btn { background: #38a169; color: white; }

    @media (max-width: 768px) { 
      body { padding: 8px; }
      .container { padding: 15px; }
      .form-row { flex-direction: column; gap: 10px; } 
      .summary-options { flex-direction: column; gap: 8px; }
      .other-options-row { flex-direction: column; gap: 8px; }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>住院醫師里程碑 2.0 評核系統</h1>
  
  <!-- 基本資料區：受評住院醫師、受評PGY醫師 與 評核主治醫師 -->
  <div class="form-row">
    <div class="form-col">
      <label class="field-label" for="residentDoctor">受評住院醫師：</label>
      <select id="residentDoctor" onchange="onResidentSelect()">
        <option value="">-- 請選擇住院醫師 --</option>
        <option value="束岳奇 (R1)">束岳奇 (R1)</option>
        <option value="呂哲為 (R1)">呂哲為 (R1)</option>
        <option value="游季蓁 (R2)">游季蓁 (R2)</option>
        <option value="李侑樺 (R2)">李侑樺 (R2)</option>
        <option value="藍韋翔 (R2)">藍韋翔 (R2)</option>
        <option value="曾以理 (R2)">曾以理 (R2)</option>
      </select>
    </div>

    <div class="form-col">
      <label class="field-label" for="pgyDoctor">受評 PGY 醫師：</label>
      <select id="pgyDoctor" onchange="onPgySelect()">
        <option value="">-- 請選擇 PGY 醫師 --</option>
        <option value="PGY 醫師 A">PGY 醫師 A</option>
        <option value="PGY 醫師 B">PGY 醫師 B</option>
        <option value="PGY 醫師 C">PGY 醫師 C</option>
        <!-- 💡 可在此自由新增或修改 PGY 醫師名單 -->
      </select>
    </div>

    <div class="form-col">
      <label class="field-label" for="evaluatorName">評核主治醫師：</label>
      <select id="evaluatorName" required>
        <option value="">-- 請選擇評核主治醫師 --</option>
        <option value="黃建維">黃建維</option>
        <option value="陳羿元">陳羿元</option>        
      </select>
    </div>
  </div>

  <!-- 6大項分頁標籤導覽列 -->
  <div class="nav-tabs" id="tabContainer"></div>

  <!-- 表單頁面容器 -->
  <div id="sectionsContainer"></div>

  <!-- 上一步/下一步/送出按鈕列 -->
  <div class="btn-row">
    <button class="action-btn prev-btn" id="prevBtn" onclick="changeStep(-1)">上一步</button>
    <button class="action-btn next-btn" id="nextBtn" onclick="changeStep(1)">下一步</button>
    <button class="action-btn submit-btn" id="submitBtn" onclick="submitForm()" style="display:none;">完成並送出評核</button>
  </div>
</div>

<script>
  // 6 大核心領域資料結構 (100% 完整保留未更改)
  const milestoneData = [
    {
      catId: "pc",
      catName: "Patient Care (病患照護)",
      tabLabel: "1. Patient Care (病患照護)",
      summaryDesc: "住院醫師於培訓計劃中，專業養成所需的知識、技能和態度/行為各方面，有令人滿意的發展。住院醫師的學習軌跡顯示其正朝向無需監督的層級前進，預期住院醫師將可以提供安全、有效、以病人為中心、及時、效率和公平的病患照護能力。",
      items: [
        { id: "pc1", title: "Patient Care 1: 病史詢問 (History)", l1: "在指導之下，訪談有常見症狀的病人，並報告詳盡的病史；在指導之下，從病人訪談以外的來源，尋找病史資料", l2: "依據鑑別診斷，訪談有常見症狀的病人，並做簡潔報告；能獨立的從病人訪談以外的來源，獲取病史資料", l3: "依據鑑別診斷，訪談有複雜症狀的病人，並做簡潔報告；整合由病人訪談與病人訪談以外來源所獲取的病史資料", l4: "有效率的問診，內容包含重要社會心理層面與其他影響健康的病史，並做簡潔報告；應用由病人訪談與病人訪談以外所獲取的資料來，安排接續的診斷檢查", l5: "根據病人、家人與醫療體系需求，包含隱晦之相關病史，進行有效率且有用的問診；為角色模範，善於應用由病人與病人以外所獲取的資料來安排接續的診斷檢查" },
        { id: "pc2", title: "Patient Care 2: 身體診察 (Physical Exam)", l1: "注意病人之舒適與安全下執行一般身體診察；辨識常見異常發現", l2: "根據臆想診斷，針對常見疾病臨床表現，執行身體診察；詮釋常見異常發現代表意義", l3: "根據臆想診斷，針對複雜臨床表現執行身體診察；辨識並詮釋不常見且複雜之異常身體診察發現所代表意義", l4: "運用進階技巧找出不易察覺的身體診察發現；整合細微身體診察發現，並導引至接續的診斷與處置", l5: "為角色模範，有效依據證據執行身體診察；教導身體診察發現之預測價值，並導引至接續的診斷與處置" },
        { id: "pc3", title: "Patient Care 3: 臨床推理 (Clinical Reasoning)", l1: "組織及正確的摘要，由病人評估所得的資料，以提出臨床臆斷", l2: "針對常見的病人表現，整合由各方所得的資料，提出基本的鑑別診斷；在照護病人時，在指導下找出臨床推理錯誤之處", l3: "針對常見的病人表現，列舉完整且具優先順序的鑑別診斷；應用臨床推理原則，回溯性的找出錯誤之處", l4: "針對複雜的病人表現，合併各種隱晦、不尋常、互相矛盾的發現，提出具優先順序的鑑別診斷；反覆、持續自我評量臨床推理過程，並及時改善病人照護", l5: "指導他人針對複雜的病人表現，提出具優先順序的鑑別診斷；展現如何辨識錯誤與反思臨床推理，為角色模範" },
        { id: "pc4", title: "Patient Care 4: 住院病人處置 (Inpatient)", l1: "能於指導下，針對常見狀況，制定處置計畫；辨識能維持與促進病人健康的機會", l2: "能針對常見狀況，制定與執行處置計畫，並敏銳地根據病程進展修正計畫；能於指導下，制訂並執行維持與促進病人健康的處置計畫", l3: "針對複雜與多重共病狀況，制定與執行以價值為導向（高評價）的處置計畫，並根據病程發展修正計畫；能結合相關的社會、心理與其他影響健康的因素，獨立制訂並執行維持與促進病人健康的處置計畫", l4: "以醫病共享方式，針對複雜與多重共病(包含重症)狀況，制定與執行以價值為導向(高評價)、詳盡的處置計畫；能結合相關的社會心理與其他影響健康的因素，獨立制訂並執行維持與促進病人健康詳盡的處置計畫", l5: "針對罕見、不明確的臨床表現，或不尋常的共病的狀況，制定與執行詳盡的處置計畫" },
        { id: "pc5", title: "Patient Care 5: 門診病人處置 (Outpatient)", l1: "辨識可維持和促進病人健康的時機；在指導之下，針對常見慢性病況，制定處置計劃；在指導之下，針對常見急性病況，制定處置計劃", l2: "制定並執行可維持和促進健康的處置計劃；能針對常見慢性病況，制定並執行處置計劃；能針對常見急性病況，制定並執行處置計劃", l3: "考量相關的社會、心理和其他影響健康的因素，制定並執行可維持和促進健康的處置計劃；能針對多重慢性病況，制定並執行處置計劃；能針對慢性共病患者併發緊急或危急情況時，制定並執行初步處置計劃", l4: "制定並執行以價值為導向(高評價)詳盡的處置計劃，以維持和促進健康；能針對多重慢性病況，考量相關的社會心理和其他影響健康的因素，制定並執行以價值為導向(高評價)詳盡的處置計劃，以維持和促進健康；能針對急性病況，制定並執行以價值為導向(高評價)的處置計劃", l5: "能針對高度複雜的慢性病況，整合各學科的建議，創建並領導以病人為中心詳盡的處置計劃；能針對罕見或不明確的病況，制定並執行處置計劃" },
        { id: "pc6", title: "Patient Care 6: 數位健康 (Digital Health)", l1: "使用電子病歷進行常規病人照護；辨識遠距看診所需的設備與方法", l2: "淋漓盡致地使電子病歷，收集並整合從病人以外所得的資料，以照護病人；以已建立被認證之資訊科技系統進行遠距看診", l3: "有效運用電子病歷各種資料，進行急、慢性病人照護；辨識可以利用遠距看診處理的臨床狀況", l4: "以電子病歷促進，達成所照護病人們的品質標的；有效整合遠距醫療於急、慢性病人的照護與臨床處置", l5: "引領電子病歷系統改善；運用新興科技與創新方法加強遠距看診" }
      ]
    },
    {
      catId: "mk",
      catName: "Medical Knowledge (醫學知識)",
      tabLabel: "2. Medical Knowledge (醫學知識)",
      summaryDesc: "住院醫師於培訓計劃中，專業養成所需的知識、技能和態度/行為各方面，有令人滿意的發展。住院醫師的學習軌跡顯示其正朝向無需監督的層級前進，預期住院醫師將可以提供安全、有效、以病人為中心、及時、效率和公平的病患照護能力。",
      items: [
        { id: "mk1", title: "Medical Knowledge 1: 應用基礎科學", l1: "以科學知識(生理、社會科學、疾病機轉)解釋正常人體功能與常見的醫療狀況", l2: "以科學知識解釋複雜的醫療狀況", l3: "整合科學知識以解釋多重器官系統疾病的共病狀況", l4: "整合科學知識解釋少見、不典型或複雜多重器官系統疾病的共病狀況", l5: "展現細緻地解釋少見、不典型或複雜病況之相關科學知識" },
        { id: "mk2", title: "Medical Knowledge 2: 治療知識", l1: "以科學知識解釋常見的治療方式", l2: "解釋常見治療的適應症、禁忌症、風險與療效", l3: "為具有共病、多系統疾病或診斷不確定的病人，整合治療知識", l4: "考量病人的臨床與心理、社會狀況，整合治療知識以制定治療選項", l5: "展現對新興、非典型或複雜治療選項細緻入微的理解" },
        { id: "mk3", title: "Medical Knowledge 3: 診斷檢查", l1: "解釋常用診斷檢查的理由、風險與好處；解釋常用診斷檢查的結果", l2: "解釋複雜性診斷檢查的理由、風險與好處；解釋複雜診斷檢查的結果", l3: "於常見疾病照護中，整合不同診斷檢查策略的價值與特色；正確的整合多項診斷檢查結果，以得到最可能的診斷", l4: "於具有共病、多重系統疾病病人照護中，整合不同診斷檢查策略的價值與特色；解釋檢查結果時，能預期診斷檢查的限制 如敏感性，專一性", l5: "展現對新興、非典型或複雜診斷檢查細緻入微的理解" }
      ]
    },
    {
      catId: "sbp",
      catName: "Systems-Based Practice (體制下工作)",
      tabLabel: "3. Systems-Based Practice (體制工作)",

  // 🎙️ 語音辨識功能
  function toggleVoiceRecognition(targetInputId, btnElement) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      alert("您的瀏覽器暫不支援網頁語音辨識。\n\n💡 建議直接點擊輸入框，使用手機鍵盤內建的「🎤 麥克風圖示」進行語音輸入！");
      return;
    }

    if (btnElement.classList.contains('recording')) {
      if (activeSpeechRecognition) activeSpeechRecognition.stop();
      return;
    }

    try {
      const recognition = new SpeechRecognition();
      recognition.lang = 'zh-TW';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = function() {
        btnElement.classList.add('recording');
        btnElement.innerHTML = '🔴 錄音中...';
        activeSpeechRecognition = recognition;
      };

      recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        const targetInput = document.getElementById(targetInputId);
        if (targetInput) {
          if (targetInput.value.trim() !== '') {
            targetInput.value += ' ' + transcript;
          } else {
            targetInput.value = transcript;
          }
        }
      };

      recognition.onerror = function(event) {
        console.error("語音辨識錯誤:", event.error);
        btnElement.classList.remove('recording');
        btnElement.innerHTML = '🎤 語音輸入';
        activeSpeechRecognition = null;
        alert("語音輸入啟動失敗 (" + event.error + ")。\n💡 建議點選輸入框，使用手機鍵盤自帶的「🎤 語音麥克風」輸入。");
      };

      recognition.onend = function() {
        btnElement.classList.remove('recording');
        btnElement.innerHTML = '🎤 語音輸入';
        activeSpeechRecognition = null;
      };

      recognition.start();
    } catch (err) {
      console.error("語音啟動失敗:", err);
    }
  }

  // 點選星星互動邏輯
  function selectStar(itemId, value, element) {
    const track = document.getElementById(`track_${itemId}`);
    const stars = track.querySelectorAll('.star-item');
    stars.forEach(s => s.classList.remove('active'));
    element.classList.add('active');

    const radio = element.querySelector('input[type="radio"]');
    if (radio) radio.checked = true;

    const otherRadios = element.closest('.eval-card').querySelectorAll('.other-options-row input[type="radio"]');
    otherRadios.forEach(r => r.checked = false);

    document.getElementById(`card_${itemId}`).classList.remove('unanswered');
  }

  // 點選其他選項
  function clearStars(itemId) {
    const track = document.getElementById(`track_${itemId}`);
    if (track) {
      const stars = track.querySelectorAll('.star-item');
      stars.forEach(s => s.classList.remove('active'));
      const starRadios = track.querySelectorAll('input[type="radio"]');
      starRadios.forEach(r => r.checked = false);
    }
    document.getElementById(`card_${itemId}`).classList.remove('unanswered');
  }

  function clearSummaryAlert(catId) {
    document.getElementById(`summary_box_${catId}`).classList.remove('unanswered');
  }

  // 檢查當前頁面填寫完整度
  function validateCurrentStep() {
    if (currentStep === 0) {
      const residentDoctor = document.getElementById('residentDoctor').value;
      const pgyDoctor = document.getElementById('pgyDoctor').value;
      const evaluatorName = document.getElementById('evaluatorName').value;

      if (!residentDoctor && !pgyDoctor) {
        alert('請選擇「受評住院醫師」或「受評 PGY 醫師」！');
        return false;
      }
      if (!evaluatorName) {
        alert('請選擇評核主治醫師！');
        return false;
      }
    }

    const currentCat = milestoneData[currentStep];
    let unansweredItems = [];

    currentCat.items.forEach((item, index) => {
      const selected = document.querySelector(`input[name="${item.id}"]:checked`);
      const card = document.getElementById(`card_${item.id}`);
      if (!selected) {
        card.classList.add('unanswered');
        unansweredItems.push(`第 ${index + 1} 題 (${item.title})`);
      } else {
        card.classList.remove('unanswered');
      }
    });

    const summarySelected = document.querySelector(`input[name="summary_status_${currentCat.catId}"]:checked`);
    const summaryBox = document.getElementById(`summary_box_${currentCat.catId}`);
    if (!summarySelected) {
      summaryBox.classList.add('unanswered');
      unansweredItems.push(`${currentCat.catName} 綜合評估`);
    } else {
      summaryBox.classList.remove('unanswered');
    }

    if (unansweredItems.length > 0) {
      alert(`尚有未作答項目：\n• ${unansweredItems[0]} 尚未作答！\n（請選擇 Level、尚未達到等級 1 或無法評估）`);
      const firstUnansweredEl = document.querySelector('.unanswered');
      if (firstUnansweredEl) {
        firstUnansweredEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      return false;
    }

    return true;
  }

  function changeStep(delta) {
    if (delta > 0 && !validateCurrentStep()) {
      return;
    }
    let nextStep = currentStep + delta;
    if (nextStep >= 0 && nextStep < milestoneData.length) {
      goToStep(nextStep);
    }
  }

  function goToStep(stepIndex) {
    currentStep = stepIndex;
    milestoneData.forEach((_, idx) => {
      document.getElementById(`section-${idx}`).classList.toggle('active', idx === currentStep);
      document.getElementById(`tab-${idx}`).classList.toggle('active', idx === currentStep);
    });
    updateStepUI();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function updateStepUI() {
    document.getElementById('prevBtn').style.display = currentStep === 0 ? 'none' : 'block';
    if (currentStep === milestoneData.length - 1) {
      document.getElementById('nextBtn').style.display = 'none';
      document.getElementById('submitBtn').style.display = 'block';
    } else {
      document.getElementById('nextBtn').style.display = 'block';
      document.getElementById('submitBtn').style.display = 'none';
    }
  }

  // ⚠️ 請填寫部署獲得的 Google Apps Script Web App URL（結尾務必為 /exec）
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxXN-jVo1IBrkF2V2kH3E59d13ONtulzCwTUDhYh5w5KwX0LqhATxL5RXL01HZJ2P2g/exec";

  function submitForm() {
    if (!validateCurrentStep()) return;

    const residentDoctor = document.getElementById('residentDoctor').value;
    const pgyDoctor = document.getElementById('pgyDoctor').value;
    const evaluatorName = document.getElementById('evaluatorName').value;

    const finalDoctorName = residentDoctor || pgyDoctor;

    let evaluations = [];

    milestoneData.forEach(cat => {
      const summaryStatus = document.querySelector(`input[name="summary_status_${cat.catId}"]:checked`)?.value || "";
      const summaryComment = document.getElementById(`summary_comment_${cat.catId}`)?.value || "";

      cat.items.forEach(item => {
        const selectedLevel = document.querySelector(`input[name="${item.id}"]:checked`)?.value || "未評估";
        const suggestion = document.getElementById(`sug_${item.id}`)?.value || "";

        evaluations.push({
          category: cat.catName,
          item: item.title,
          level: selectedLevel,
          suggestion: suggestion,
          overallStatus: summaryStatus,
          overallComment: summaryComment
        });
      });
    });

    const payload = {
      doctorName: finalDoctorName,
      evaluatorName: evaluatorName,
      evaluations: evaluations
    };

    fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
      alert('評核結果已成功送出並紀錄至 Google 試算表！');
      location.reload();
    })
    .catch(err => {
      alert('送出失敗，請檢查網路或 Apps Script URL');
      console.error(err);
    });
  }

  window.onload = initForm;
</script>

</body>
</html>
