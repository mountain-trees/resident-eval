<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>內科住院醫師里程碑 2.0 線上評核表</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f0f4f8; margin: 0; padding: 20px; color: #2d3748; }

    .form-col { flex: 1; }
    label.field-label { font-weight: bold; display: block; margin-bottom: 8px; font-size: 15px; color: #2b6cb0; }

    .category-header { background: #2b6cb0; color: white; padding: 10px 15px; font-size: 18px; font-weight: bold; border-radius: 6px; margin: 30px 0 15px 0; }

    .eval-title { font-weight: bold; font-size: 17px; color: #2c5282; margin-bottom: 12px; border-left: 4px solid #3182ce; padding-left: 10px; }
    
    .level-group { display: flex; flex-direction: column; gap: 8px; }
    .level-option { border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px 12px; background: #f8fafc; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: flex-start; }
    .level-option:hover { background: #ebf8ff; border-color: #63b3ed; }
    .level-option input[type="radio"] { margin-top: 3px; margin-right: 12px; transform: scale(1.2); }
    
    .level-tag { font-weight: bold; color: #2b6cb0; min-width: 80px; font-size: 14.5px; }
    .level-desc { font-size: 14px; color: #4a5568; line-height: 1.4; flex: 1; }
    
    .level-option.half-level { background: #fff; border-style: dashed; border-color: #cbd5e0; margin-left: 18px; }
    .level-option.half-level .level-tag { color: #d69e2e; }
    .level-option.half-level .level-desc { color: #718096; font-style: italic; }
    .level-option.other-option { background: #fff5f5; border-color: #fed7d7; }
    .level-option.other-option .level-tag { color: #c53030; }

    .submit-btn { width: 100%; background: #3182ce; color: white; border: none; padding: 16px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 20px; }

  </style>
</head>
<body>

<div class="container">
  <h1>內科住院醫師里程碑 2.0 臨床評核表</h1>
  
  <div class="form-row">
    <div class="form-col">
      <label class="field-label" for="doctorName">受評住院醫師姓名：</label>
      <select id="doctorName" required>
        <option value="">-- 請選擇住院醫師 --</option>
        <option value="陳大明">陳大明 (R1)</option>
        <option value="林小華">林小華 (R2)</option>
        <option value="張志豪">張志豪 (R3)</option>
        <option value="黃美玲">黃美玲 (R3)</option>
      </select>
    </div>

    <div class="form-col">
      <label class="field-label" for="evaluatorName">評核主治醫師姓名：</label>
      <input type="text" id="evaluatorName" placeholder="請輸入主治醫師姓名" required>
    </div>
  </div>

  <!-- 動態生成 22 個評核項目的容器 -->
  <div id="evaluationContainer"></div>

  <div class="form-group" style="margin-top: 30px;">
    <label class="field-label" for="comments">總體建議與具體評語：</label>
    <textarea id="comments" rows="5" placeholder="請填寫整體臨床表現建議與改善方向..."></textarea>
  </div>

  <button class="submit-btn" onclick="submitForm()">送出評核結果</button>
</div>

          l1: "有禮貌的請求跟回應會診；表達對跨領域團隊所有成員之尊重",
          l2: "清楚簡潔的請求跟回應會診；與團隊成員彼此互通訊息（含回饋）",
          l3: "會診時檢視彼此理解是否一致；促進團隊溝通以調和衝突與給予困難回饋",
          l4: "協調不同會診者建議以優化照護；調整溝通模式；弭平會診者間歧見與衝突",
          l5: "以彈性溝通策略促進卓越團隊合作，為角色模範"
        },
        {
          id: "ics3", title: "ICS 3: 醫療系統內的溝通 (Communication Within Health Systems)",
          l1: "正確記錄病人完整及目前資訊；使用體制政策指定模式保護個人健康資訊",
          l2: "以有組織方式記錄臨床訪視（含臨床推理）；協助下選擇適當直接/間接溝通方式",
          l3: "以簡潔且完整方式記錄臨床訪視；根據臨床情境選擇適當直接/間接溝通方式",
          l4: "以清楚、簡潔、及時且有組織方式記錄訪視（含預期發展）；為有效溝通模範",
          l5: "指導制定部門或體制的溝通政策和程序"
        }
      ]
    }
  ];

  // 動態繪製所有項目
  const container = document.getElementById('evaluationContainer');
  milestoneData.forEach(cat => {
    const catHeader = document.createElement('div');
    catHeader.className = 'category-header';
    catHeader.innerText = cat.category;
    container.appendChild(catHeader);

    cat.items.forEach(item => {
      const card = document.createElement('div');
      card.className = 'eval-card';
      card.innerHTML = `
        <div class="eval-title">${item.title}</div>
        <div class="level-group">
          <label class="level-option"><input type="radio" name="${item.id}" value="Level 1" required><span class="level-tag">Level 1</span><span class="level-desc">${item.l1}</span></label>
          <label class="level-option half-level"><input type="radio" name="${item.id}" value="Level 1.5"><span class="level-tag">Level 1.5</span><span class="level-desc">表現介於 Level 1 與 Level 2 之間</span></label>
          <label class="level-option"><input type="radio" name="${item.id}" value="Level 2"><span class="level-tag">Level 2</span><span class="level-desc">${item.l2}</span></label>
          <label class="level-option half-level"><input type="radio" name="${item.id}" value="Level 2.5"><span class="level-tag">Level 2.5</span><span class="level-desc">表現介於 Level 2 與 Level 3 之間</span></label>
          <label class="level-option"><input type="radio" name="${item.id}" value="Level 3"><span class="level-tag">Level 3</span><span class="level-desc">${item.l3}</span></label>
          <label class="level-option half-level"><input type="radio" name="${item.id}" value="Level 3.5"><span class="level-tag">Level 3.5</span><span class="level-desc">表現介於 Level 3 與 Level 4 之間</span></label>
          <label class="level-option"><input type="radio" name="${item.id}" value="Level 4"><span class="level-tag">Level 4</span><span class="level-desc">${item.l4}</span></label>
          <label class="level-option half-level"><input type="radio" name="${item.id}" value="Level 4.5"><span class="level-tag">Level 4.5</span><span class="level-desc">表現介於 Level 4 與 Level 5 之間</span></label>
          <label class="level-option"><input type="radio" name="${item.id}" value="Level 5"><span class="level-tag">Level 5</span><span class="level-desc">${item.l5}</span></label>
          <label class="level-option other-option"><input type="radio" name="${item.id}" value="尚未達到等級 1"><span class="level-tag">其他</span><span class="level-desc">尚未達到等級 1</span></label>
          <label class="level-option other-option"><input type="radio" name="${item.id}" value="無法評估"><span class="level-tag">其他</span><span class="level-desc">無法評估</span></label>
        </div>
      `;
      container.appendChild(card);
    });
  });

  // ⚠️ 請填寫你部署獲得的 Google Apps Script Web App URL
  const GOOGLE_SCRIPT_URL = "請替換成你的_Google_Apps_Script_URL";

  function submitForm() {
    const doctorName = document.getElementById('doctorName').value;
    const evaluatorName = document.getElementById('evaluatorName').value;
    const comments = document.getElementById('comments').value;

    if (!doctorName) { alert('請選擇受評住院醫師！'); return; }
    if (!evaluatorName) { alert('請填寫評核主治醫師姓名！'); return; }

    let evaluations = [];
    let allAnswered = true;

    milestoneData.forEach(cat => {
      cat.items.forEach(item => {
        const selected = document.querySelector(`input[name="${item.id}"]:checked`);
        if (!selected) {
          allAnswered = false;
        } else {
          evaluations.push({
            item: item.title,
            level: selected.value
          });
        }
      });
    });

    if (!allAnswered) {
      if (!confirm('尚有項目未完成選擇，確定要直接送出嗎？')) {
        return;
      }
    }

    const payload = {
      doctorName: doctorName,
      evaluatorName: evaluatorName,
      comments: comments,
      evaluations: evaluations
    };

    fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
      alert('所有評核項目已成功送出並紀錄至 Google 試算表！');
      location.reload();
    })
    .catch(err => {
      alert('送出失敗，請檢查網路或 Apps Script URL');
      console.error(err);
    });
  }
</script>

</body>
</html>
