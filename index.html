<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>住院醫師里程碑 2.0 線上評核系統</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f0f4f8; margin: 0; padding: 15px; color: #2d3748; }
    .container { max-width: 950px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h1 { color: #1a365d; text-align: center; font-size: 22px; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; padding-bottom: 12px; }
    
    /* 基本資料列 */
    .form-row { display: flex; gap: 15px; margin-bottom: 20px; background: #ebf8ff; padding: 15px; border-radius: 8px; border: 1px solid #bee3f8; }
    .form-col { flex: 1; }
    label.field-label { font-weight: bold; display: block; margin-bottom: 6px; font-size: 14px; color: #2b6cb0; }
    input[type="text"], select, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; font-size: 14px; background-color: #fff; }
    
    /* 分頁標籤導覽 (Tabs) */
    .nav-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
    .tab-btn { padding: 9px 14px; border: none; background: #e2e8f0; color: #4a5568; font-weight: bold; font-size: 13.5px; border-radius: 6px; cursor: pointer; transition: 0.2s; white-space: nowrap; }
    .tab-btn.active { background: #3182ce; color: white; }
    .tab-btn:hover:not(.active) { background: #cbd5e0; }

    /* Section 區塊控制 */
    .section-content { display: none; }
    .section-content.active { display: block; }
    .category-title { background: #2b6cb0; color: white; padding: 10px 15px; font-size: 17px; font-weight: bold; border-radius: 6px; margin-bottom: 15px; }

    /* 評核卡片樣式 */
    .eval-card { border: 1px solid #e2e8f0; border-radius: 8px; padding: 18px; margin-bottom: 25px; background: #ffffff; }
    .eval-title { font-weight: bold; font-size: 16.5px; color: #2c5282; margin-bottom: 12px; border-left: 4px solid #3182ce; padding-left: 8px; }
    
    /* Word 格式 5 欄表格 (淺灰色邊框) */
    .level-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; table-layout: fixed; }
    .level-table th { background-color: #edf2f7; color: #2b6cb0; border: 1px solid #cbd5e0; padding: 8px; font-size: 14px; text-align: center; width: 20%; }
    .level-table td { border: 1px solid #cbd5e0; padding: 10px; font-size: 13px; color: #4a5568; line-height: 1.5; vertical-align: top; background-color: #fafafc; }

    /* 9顆星星位置定位軌道 (對齊表格) */
    .star-track-container { position: relative; width: 100%; height: 65px; margin-top: 15px; margin-bottom: 12px; background: #f7fafc; border: 1px dashed #cbd5e0; border-radius: 8px; }
    .star-item { position: absolute; top: 8px; transform: translateX(-50%); text-align: center; cursor: pointer; user-select: none; }
    .star-icon { font-size: 26px; color: #cbd5e0; transition: color 0.2s, transform 0.2s; }
    .star-item:hover .star-icon, .star-item.active .star-icon { color: #f59e0b; transform: scale(1.15); }
    .star-label { font-size: 11px; font-weight: bold; color: #718096; margin-top: 2px; }
    .star-item.active .star-label { color: #d69e2e; }

    /* 隱藏原生 radio 按鈕 */
    .star-item input[type="radio"] { display: none; }

    /* 特殊選項列（尚未達到等級 1 / 無法評估） */
    .other-options-row { display: flex; gap: 20px; margin-top: 10px; padding: 10px 14px; background: #fff5f5; border: 1px solid #fed7d7; border-radius: 6px; }
    .other-options-row label { font-size: 13.5px; font-weight: bold; color: #c53030; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .other-options-row input[type="radio"] { transform: scale(1.15); cursor: pointer; }

    /* 個別建議欄位 */
    .item-suggestion { margin-top: 15px; background: #f8fafc; padding: 10px; border-radius: 6px; border: 1px solid #e2e8f0; }
    .item-suggestion label { font-size: 13px; font-weight: bold; color: #4a5568; display: block; margin-bottom: 4px; }

    /* 大項總結區塊 */
    .category-summary-box { background: #fffaf0; border: 1px solid #feebc8; border-radius: 8px; padding: 15px; margin-top: 25px; margin-bottom: 15px; }
    .summary-title { font-weight: bold; color: #9c4221; font-size: 15px; margin-bottom: 8px; }
    .summary-desc { font-size: 13px; color: #744210; margin-bottom: 10px; line-height: 1.5; }
    .summary-options { display: flex; gap: 15px; margin-bottom: 10px; }
    .summary-options label { font-size: 14px; font-weight: bold; color: #2d3748; cursor: pointer; }

    /* 按鈕列 */
    .btn-row { display: flex; justify-content: space-between; margin-top: 25px; gap: 15px; }
    .action-btn { flex: 1; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; }
    .prev-btn { background: #e2e8f0; color: #4a5568; }
    .next-btn { background: #3182ce; color: white; }
    .submit-btn { background: #38a169; color: white; }

    @media (max-width: 640px) { 
      .form-row { flex-direction: column; gap: 10px; } 
      .summary-options { flex-direction: column; gap: 8px; }
      .nav-tabs { overflow-x: auto; flex-wrap: nowrap; padding-bottom: 5px; }
      .level-table { font-size: 11px; }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>住院醫師里程碑 2.0 評核系統</h1>
  
  <!-- 基本資料區 -->
  <div class="form-row">
    <div class="form-col">
      <label class="field-label" for="doctorName">受評住院醫師：</label>
      <select id="doctorName" required>
        <option value="束岳奇">束岳奇 (R1)</option>
        <option value="呂哲為">呂哲為 (R1)</option>
        <option value="游季蓁">游季蓁 (R2)</option>
        <option value="李侑樺">李侑樺 (R2)</option>
        <option value="藍韋翔">藍韋翔 (R2)</option>
        <option value="曾以理">曾以理 (R2)</option>
      </select>
    </div>
    <div class="form-col">
      <label class="field-label" for="evaluatorName">評核主治醫師：</label>
      <input type="text" id="evaluatorName" placeholder="請輸入主治醫師姓名" required>
    </div>
  </div>

  <!-- 6大項分頁標籤導覽列 -->
  <div class="nav-tabs" id="tabContainer"></div>

  <!-- 表單頁面容器 -->
  <div id="sectionsContainer"></div>

  <!-- 上一步/下一步/送出按鈕列 -->
  <div class="btn-row">
    <button class="action-btn prev-btn" id="prevBtn" onclick="changeStep(-1)">上一步</button>
    <button class="action-btn next-btn" id="nextBtn" onclick="changeStep(1)">下一步</button>
    <button class="action-btn submit-btn" id="submitBtn" onclick="submitForm()" style="display:none;">完成並送出評核</button>
  </div>
</div>

<script>
  // 6 大核心領域資料結構
  const milestoneData = [
    {
      catId: "pc",
      catName: "Patient Care (病患照護)",
      tabLabel: "1. Patient Care (病患照護)",
      summaryDesc: "住院醫師於培訓計劃中，專業養成所需的知識、技能和態度/行為各方面，有令人滿意的發展。預期住院醫師將可以提供安全、有效、以病人為中心、及時、效率和公平的病患照護能力。",
      items: [
        { id: "pc1", title: "Patient Care 1: 病史詢問 (History)", l1: "在指導之下，訪談有常見症狀的病人，並報告詳盡的病史；在指導之下，從病人訪談以外的來源，尋找病史資料", l2: "依據鑑別診斷，訪談有常見症狀的病人，並做簡潔報告；能獨立的從病人訪談以外的來源，獲取病史資料", l3: "依據鑑別診斷，訪談有複雜症狀的病人，並做簡潔報告；整合由病人訪談與病人訪談以外來源所獲取的病史資料", l4: "有效率的問診，內容包含重要社會心理層面與其他影響健康的病史，並做簡潔報告；應用由病人訪談與病人訪談以外所獲取的資料來，安排接續的診斷檢查", l5: "根據病人、家人與醫療體系需求，包含隱晦之相關病史，進行有效率且有用的問診；為角色模範，善於應用由病人與病人以外所獲取的資料來安排接續的診斷檢查" },
        { id: "pc2", title: "Patient Care 2: 身體診察 (Physical Exam)", l1: "注意病人之舒適與安全下執行一般身體診察；辨識常見異常發現", l2: "根據臆想診斷，針對常見疾病臨床表現，執行身體診察；詮釋常見異常發現代表意義", l3: "根據臆想診斷，針對複雜臨床表現執行身體診察；辨識並詮釋不常見且複雜之異常身體診察發現所代表意義", l4: "運用進階技巧找出不易察覺的身體診察發現；整合細微身體診察發現，並導引至接續的診斷與處置", l5: "為角色模範，有效依據證據執行身體診察；教導身體診察發現之預測價值，並導引至接續的診斷與處置" },
        { id: "pc3", title: "Patient Care 3: 臨床推理 (Clinical Reasoning)", l1: "組織及正確的摘要，由病人評估所得的資料，以提出臨床臆斷", l2: "針對常見的病人表現，整合由各方所得的資料，提出基本的鑑別診斷；在照護病人時，在指導下找出臨床推理錯誤之處", l3: "針對常見的病人表現，列舉完整且具優先順序的鑑別診斷；應用臨床推理原則，回溯性的找出錯誤之處", l4: "針對複雜的病人表現，合併各種隱晦、不尋常、互相矛盾的發現，提出具優先順序的鑑別診斷；反覆、持續自我評量臨床推理過程，並及時改善病人照護", l5: "指導他人針對複雜的病人表現，提出具優先順序的鑑別診斷；展現如何辨識錯誤與反思臨床推理，為角色模範" },
        { id: "pc4", title: "Patient Care 4: 住院病人處置 (Inpatient)", l1: "能於指導下，針對常見狀況，制定處置計畫；辨識能維持與促進病人健康的機會", l2: "能針對常見狀況，制定與執行處置計畫，並敏銳地根據病程進展修正計畫；能於指導下，制訂並執行維持與促進病人健康的處置計畫", l3: "針對複雜與多重共病狀況，制定與執行以價值為導向（高評價）的處置計畫，並根據病程發展修正計畫；能結合相關的社會、心理與其他影響健康的因素，獨立制訂並執行維持與促進病人健康的處置計畫", l4: "以醫病共享方式，針對複雜與多重共病(包含重症)狀況，制定與執行以價值為導向(高評價)、詳盡的處置計畫；能結合相關的社會心理與其他影響健康的因素，獨立制訂並執行維持與促進病人健康詳盡的處置計畫", l5: "針對罕見、不明確的臨床表現，或不尋常的共病的狀況，制定與執行詳盡的處置計畫" },
        { id: "pc5", title: "Patient Care 5: 門診病人處置 (Outpatient)", l1: "辨識可維持和促進病人健康的時機；在指導之下，針對常見慢性病況，制定處置計劃；在指導之下，針對常見急性病況，制定處置計劃", l2: "制定並執行可維持和促進健康的處置計劃；能針對常見慢性病況，制定並執行處置計劃；能針對常見急性病況，制定並執行處置計劃", l3: "考量相關的社會、心理和其他影響健康的因素，制定並執行可維持和促進健康的處置計劃；能針對多重慢性病況，制定並執行處置計劃；能針對慢性共病患者併發緊急或危急情況時，制定並執行初步處置計劃", l4: "制定並執行以價值為導向(高評價)詳盡的處置計劃，以維持和促進健康；能針對多重慢性病況，考量相關的社會心理和其他影響健康的因素，制定並執行以價值為導向(高評價)詳盡的處置計劃，以維持和促進健康；能針對急性病況，制定並執行以價值為導向(高評價)的處置計劃", l5: "能針對高度複雜的慢性病況，整合各學科的建議，創建並領導以病人為中心詳盡的處置計劃；能針對罕見或不明確的病況，制定並執行處置計劃" },
        { id: "pc6", title: "Patient Care 6: 數位健康 (Digital Health)", l1: "使用電子病歷進行常規病人照護；辨識遠距看診所需的設備與方法", l2: "淋漓盡致地使電子病歷，收集並整合從病人以外所得的資料，以照護病人；以已建立被認證之資訊科技系統進行遠距看診", l3: "有效運用電子病歷各種資料，進行急、慢性病人照護；辨識可以利用遠距看診處理的臨床狀況", l4: "以電子病歷促進，達成所照護病人們的品質標的；有效整合遠距醫療於急、慢性病人的照護與臨床處置", l5: "引領電子病歷系統改善；運用新興科技與創新方法加強遠距看診" }
      ]
    },
    {
      catId: "mk",
      catName: "Medical Knowledge (醫學知識)",
      tabLabel: "2. Medical Knowledge (醫學知識)",
      summaryDesc: "住院醫師正朝向無需監督的層級前進，預期將具備足夠的醫學基礎知識與應用能力。",
      items: [
        { id: "mk1", title: "Medical Knowledge 1: 應用基礎科學", l1: "以科學知識解釋正常人體功能與常見醫療狀況", l2: "以科學知識解釋複雜的醫療狀況", l3: "整合科學知識以解釋多重器官系統疾病的共病狀況", l4: "整合科學知識解釋少見、不典型或複雜多重器官系統疾病共病", l5: "展現細緻地解釋少見、不典型或複雜病況之相關科學知識" },
        { id: "mk2", title: "Medical Knowledge 2: 治療知識", l1: "以科學知識解釋常見的治療方式", l2: "解釋常見治療的適應症、禁忌症、風險與療效", l3: "為具有共病、多系統疾病或診斷不確定的病人整合治療知識", l4: "考量臨床與心理社會狀況，整合治療知識以制定選項", l5: "展現對新興、非典型或複雜治療選項細緻入微的理解" },
        { id: "mk3", title: "Medical Knowledge 3: 診斷檢查", l1: "解釋常用診斷檢查的理由與結果", l2: "解釋複雜性診斷檢查的理由與結果", l3: "整合不同診斷檢查策略之價值與特色；正確整合檢查結果", l4: "於共病或多系統疾病中整合檢查策略；預期診斷檢查限制", l5: "展現對新興、非典型或複雜診斷檢查細緻入微的理解" }

    },
    {

      items: [

        { id: "sbp2", title: "SBP 2: 以病人為中心的照護系統", l1: "展現跨團隊照護知識；知道安全交班關鍵要素", l2: "常規情況下運用跨專業團隊；執行安全交班；辨識社區健康需求", l3: "複雜情況下運用團隊照護；完成複雜交班；有效利用在地資源", l4: "建立跨專業整合模式為模範；倡導院間安全交班", l5: "分析團隊照護過程並引領改善；改善交班品質為就醫不平等發聲" },

      items: [
        { id: "pb1", title: "PBLI 1: 實證與知情 (5A)", l1: "在指導之下，展現如何獲取、分類和分析臨床證據", l2: "清楚明瞭臨床問題，根據偏好與價值觀進行實證照護", l3: "精密評估與應用最佳臨床證據，結合病人偏好於複雜照護", l4: "即使面對不確定與矛盾證據，也能引用實證為病人量身訂製", l5: "指導他人對搜尋所得之臨床實證做精密評估與應用" },
        { id: "pb2", title: "PBLI 2: 持續反思與自我成長 (5R)", l1: "設定目標；指導下找出理想與實際表現落差的因素", l2: "敞開心胸面對評量回饋；分析落差因素並積極尋求改進", l3: "謙遜徵求評量結果；自主反思落差；提示下執行學習計劃", l4: "持續廣為徵求評量；檢討原先假設；獨立制定與實施學習計劃", l5: "為謙遜徵求評量之角色模範；指導他人反思；衡量學習計劃效果" }
      ]
    },
    {
      catId: "prof",
      catName: "Professionalism (專業素養)",
      tabLabel: "5. Professionalism (專業素養)",
      summaryDesc: "住院醫師展現高度倫理素養、責任心、遵從專業規範，並關注個人與團隊健康狀態。",
      items: [
        { id: "prof1", title: "Professionalism 1: 專業的舉止", l1: "在常規工作中，展現專業行為", l2: "找出造成專業失誤的潛在誘因，為自己的失誤承擔責任", l3: "在複雜或承受壓力的狀況下，展現專業行為", l4: "辨認可能引發專業失誤的情況，預防自己與他人的失誤", l5: "當他人的行為不符合專業期望時，給予指導" },
        { id: "prof2", title: "Professionalism 2: 倫理四原則", l1: "知道基本倫理原則（自主、不傷害、行善、正義）", l2: "應用基本倫理原則來處置單純狀況", l3: "以倫理原則分析複雜情境，能適時尋求協助", l4: "分析複雜倫理情境，適當運用資源解決倫理困境", l5: "辨識並尋求解決醫療體系層級會誘發倫理問題的因素" },
        { id: "prof3", title: "Professionalism 3: 負責及責任心", l1: "在提醒之下，處理行政工作跟病人照護責任", l2: "在常態下，適時處理行政工作跟病人照護責任", l3: "在複雜或有壓力情境下，適時處理行政與照護責任", l4: "積極施行策略，確保病人、團隊跟系統需求被滿足", l5: "制定策略以促進他人有效率完成行政與照護責任" },
        { id: "prof4", title: "Professionalism 4: 影響「良好狀態」之因素", l1: "知道於處理影響「良好狀態」事件時，尋求幫助的重要性", l2: "列出支持良好狀態之資源；辨認影響良好狀態之體制因素", l3: "提示下反思良好狀態對臨床之影響；描述體制因素", l4: "面對工作情緒挑戰能即時反思並積極應對；提出解決方案", l5: "參與體制變革以促進專業及個人「良好狀態」" }
      ]
    },
    {
      catId: "ics",
      catName: "Interpersonal and Communication Skills (溝通技巧)",
      tabLabel: "6. ICS (人際與溝通技巧)",
      summaryDesc: "住院醫師能進行以病人為中心的良好溝通，並與跨專業團隊進行有效協作與記錄。",
      items: [
        { id: "ics1", title: "ICS 1: 以患者和家庭為中心的溝通", l1: "以言語及非言語行為展現尊重；辨識常見溝通阻礙", l2: "單純情境中有效溝通建立醫病關係；辨識複雜溝通阻礙", l3: "複雜情境中有效溝通維持醫病關係；減少溝通障礙", l4: "無論情境複雜與否均運用醫病共享模式；為減少障礙模範", l5: "教導他人如何建立醫病關係與減少溝通障礙" },
        { id: "ics2", title: "ICS 2: 跨專業和團隊溝通", l1: "有禮貌的請求跟回應會診；表達對跨領域團隊之尊重", l2: "清楚簡潔的請求跟回應會診；與團隊成員互通訊息", l3: "會診時檢視彼此理解是否一致；調和衝突與給予回饋", l4: "協調不同會診者建議；調整溝通模式；弭平團隊衝突", l5: "以彈性溝通策略促進團隊合作，為角色模範" },
        { id: "ics3", title: "ICS 3: 醫療系統內的溝通", l1: "正確記錄病人完整資訊；保護個人健康資訊", l2: "以有組織方式記錄臨床訪視；選擇適當溝通方式", l3: "以簡潔且完整方式記錄訪視；選擇適當溝通方式", l4: "以清楚、簡潔、及時且有組織方式記錄訪視；為溝通模範", l5: "指導制定部門或體制的溝通政策和程序" }
      ]
    }
  ];

  // 9 個星號對齊位址 (10%, 20% ... 90%)
  const starLevels = [
    { val: "Level 1", label: "L1", pos: "10%" },
    { val: "Level 1.5", label: "L1.5", pos: "20%" },
    { val: "Level 2", label: "L2", pos: "30%" },
    { val: "Level 2.5", label: "L2.5", pos: "40%" },
    { val: "Level 3", label: "L3", pos: "50%" },
    { val: "Level 3.5", label: "L3.5", pos: "60%" },
    { val: "Level 4", label: "L4", pos: "70%" },
    { val: "Level 4.5", label: "L4.5", pos: "80%" },
    { val: "Level 5", label: "L5", pos: "90%" }
  ];

  let currentStep = 0;

  function initForm() {
    const tabContainer = document.getElementById('tabContainer');
    const sectionsContainer = document.getElementById('sectionsContainer');

    milestoneData.forEach((cat, cIdx) => {
      const tabBtn = document.createElement('button');
      tabBtn.className = `tab-btn ${cIdx === 0 ? 'active' : ''}`;
      tabBtn.id = `tab-${cIdx}`;
      tabBtn.innerText = cat.tabLabel;
      tabBtn.onclick = () => goToStep(cIdx);
      tabContainer.appendChild(tabBtn);

      const secDiv = document.createElement('div');
      secDiv.className = `section-content ${cIdx === 0 ? 'active' : ''}`;
      secDiv.id = `section-${cIdx}`;

      let html = `<div class="category-title">${cat.catName}</div>`;

      cat.items.forEach(item => {
        let starsHtml = starLevels.map(st => `
          <div class="star-item" style="left: ${st.pos};" onclick="selectStar('${item.id}', '${st.val}', this)">
            <input type="radio" name="${item.id}" value="${st.val}">
            <div class="star-icon">★</div>
            <div class="star-label">${st.label}</div>
          </div>
        `).join('');

        html += `
          <div class="eval-card">
            <div class="eval-title">${item.title}</div>
            
            <table class="level-table">
              <thead>
                <tr>
                  <th>Level 1</th>
                  <th>Level 2</th>
                  <th>Level 3</th>
                  <th>Level 4</th>
                  <th>Level 5</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>${item.l1}</td>
                  <td>${item.l2}</td>
                  <td>${item.l3}</td>
                  <td>${item.l4}</td>
                  <td>${item.l5}</td>
                </tr>
              </tbody>
            </table>

            <div class="star-track-container" id="track_${item.id}">
              ${starsHtml}
            </div>

            <!-- 保留並補全「尚未達到等級1」與「無法評估」 -->
            <div class="other-options-row">
              <label><input type="radio" name="${item.id}" value="尚未達到等級 1" onclick="clearStars('${item.id}')"> 尚未達到等級 1</label>
              <label><input type="radio" name="${item.id}" value="無法評估" onclick="clearStars('${item.id}')"> 無法評估</label>
            </div>

            <div class="item-suggestion">
              <label for="sug_${item.id}">建議 / 具體評語：</label>
              <input type="text" id="sug_${item.id}" placeholder="可輸入對該項目的文字建議...">
            </div>
          </div>
        `;
      });

      html += `
        <div class="category-summary-box">
          <div class="summary-title">${cat.catName} 綜合評估</div>
          <div class="summary-desc">${cat.summaryDesc}</div>
          <div class="summary-options">
            <label><input type="radio" name="summary_status_${cat.catId}" value="是 (Yes)"> 是 (Yes)</label>
            <label><input type="radio" name="summary_status_${cat.catId}" value="否 (No)"> 否 (No)</label>
            <label><input type="radio" name="summary_status_${cat.catId}" value="狀況改善中 (Conditional)"> 狀況改善中</label>
          </div>
          <textarea id="summary_comment_${cat.catId}" rows="2" placeholder="對本大項的綜合評語與整體建議..."></textarea>
        </div>
      `;

      secDiv.innerHTML = html;
      sectionsContainer.appendChild(secDiv);
    });

    updateStepUI();
  }

  function selectStar(itemId, value, element) {
    const track = document.getElementById(`track_${itemId}`);
    const stars = track.querySelectorAll('.star-item');
    stars.forEach(s => s.classList.remove('active'));
    element.classList.add('active');

    const radio = element.querySelector('input[type="radio"]');
    if (radio) radio.checked = true;

    const otherRadios = element.closest('.eval-card').querySelectorAll('.other-options-row input[type="radio"]');
    otherRadios.forEach(r => r.checked = false);
  }

  function clearStars(itemId) {
    const track = document.getElementById(`track_${itemId}`);
    if (track) {
      const stars = track.querySelectorAll('.star-item');
      stars.forEach(s => s.classList.remove('active'));
      const starRadios = track.querySelectorAll('input[type="radio"]');
      starRadios.forEach(r => r.checked = false);
    }
  }

  function changeStep(delta) {
    let nextStep = currentStep + delta;
    if (nextStep >= 0 && nextStep < milestoneData.length) {
      goToStep(nextStep);
    }
  }

  function goToStep(stepIndex) {
    currentStep = stepIndex;
    milestoneData.forEach((_, idx) => {
      document.getElementById(`section-${idx}`).classList.toggle('active', idx === currentStep);
      document.getElementById(`tab-${idx}`).classList.toggle('active', idx === currentStep);
    });
    updateStepUI();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function updateStepUI() {
    document.getElementById('prevBtn').style.display = currentStep === 0 ? 'none' : 'block';
    if (currentStep === milestoneData.length - 1) {
      document.getElementById('nextBtn').style.display = 'none';
      document.getElementById('submitBtn').style.display = 'block';
    } else {
      document.getElementById('nextBtn').style.display = 'block';
      document.getElementById('submitBtn').style.display = 'none';
    }
  }

  const GOOGLE_SCRIPT_URL = "https://script.google.com/u/0/home/projects/12qF1_sZVhG6aWQ3qjLNahiBtpLWuenRmADGMnd7X1m04WQNDwDLnWm4q/edit";

  function submitForm() {
    const doctorName = document.getElementById('doctorName').value;
    const evaluatorName = document.getElementById('evaluatorName').value;

    if (!doctorName) { alert('請選擇受評住院醫師！'); return; }
    if (!evaluatorName) { alert('請填寫評核主治醫師姓名！'); return; }

    let evaluations = [];

    milestoneData.forEach(cat => {
      const summaryStatus = document.querySelector(`input[name="summary_status_${cat.catId}"]:checked`)?.value || "";
      const summaryComment = document.getElementById(`summary_comment_${cat.catId}`)?.value || "";

      cat.items.forEach(item => {
        const selectedLevel = document.querySelector(`input[name="${item.id}"]:checked`)?.value || "未評估";
        const suggestion = document.getElementById(`sug_${item.id}`)?.value || "";

        evaluations.push({
          category: cat.catName,
          item: item.title,
          level: selectedLevel,
          suggestion: suggestion,
          overallStatus: summaryStatus,
          overallComment: summaryComment
        });
      });
    });

    const payload = {
      doctorName: doctorName,
      evaluatorName: evaluatorName,
      evaluations: evaluations
    };

    fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
      alert('評核結果已成功送出並紀錄至 Google 試算表！');
      location.reload();
    })
    .catch(err => {
      alert('送出失敗，請檢查網路或 Apps Script URL');
      console.error(err);
    });
  }

  window.onload = initForm;
</script>

</body>
</html>
